<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>कॉलोनी मित्र</title>
<meta name="description" content="कॉलोनी का पूरा रजिस्टर: घर, किराएदार, मेंटेनेंस, हिसाब, शिकायतें, पार्किंग और CCTV। अभिराज डिजिटल।">
<meta name="theme-color" content="#0B6FBF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="कॉलोनी मित्र">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* कॉलोनी मित्र — colony register: gradient header with toran, coloured tab strip, ledger-like sections */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1B2622; --muted:#5E6B66; --line:#DCE2DC;
  --accent:#17614F; --accent-ink:#FFFFFF; --accent-soft:#E2EFEA; --marigold:#C9820E; --marigold-soft:#FBF0DA;
  --ok:#1F7A3E; --ok-soft:#E3F3E7; --bad:#B3261E; --bad-soft:#FBE7E5; --warn:#9A6400; --warn-soft:#FDF1D6; --info:#245D9C; --info-soft:#E4EDF8;
  --display:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --r:10px;
  --t-home:#D9480F; --t-houses:#1864AB; --t-parking:#7048E8; --t-maint:#2B8A3E; --t-comp:#C2255C; --t-acct:#0C8599; --t-polls:#4C3FD1; --t-gallery:#A61E8C; --t-admin:#9A6700; --t-svc:#5C7F0A; --t-team:#A33A12; --t-cctv:#30577F; --t-myhouse:#0B7285; --t-tenants:#5F3DC4; --t-fees:#B35C00; --t-msgs:#087F5B; --tc-ink:#FFFFFF;
  --tc:var(--accent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2C3833;
  --accent:#5CC2A5; --accent-ink:#0B1A15; --accent-soft:#1D3A32; --marigold:#E8AE4A; --marigold-soft:#3A2D14;
  --ok:#6FD08E; --ok-soft:#173222; --bad:#F2867D; --bad-soft:#3D1D1B; --warn:#EDBE5C; --warn-soft:#3A2E12; --info:#8AB8EE; --info-soft:#1A2A3F;
  --t-home:#FF8F5A; --t-houses:#74B3F5; --t-parking:#A98BFF; --t-maint:#5FD27A; --t-comp:#FF7FA8; --t-acct:#45CBDD; --t-polls:#9D95FF; --t-gallery:#EB7FD8; --t-admin:#F2C14E; --t-svc:#A9E34B; --t-team:#FFA07A; --t-cctv:#8DB8E8; --t-myhouse:#4FC9DB; --t-tenants:#B197FC; --t-fees:#FFA94D; --t-msgs:#63E6BE; --tc-ink:#10141A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --ink:#E6ECE9; --muted:#9AA8A2; --line:#2C3833;
  --accent:#5CC2A5; --accent-ink:#0B1A15; --accent-soft:#1D3A32; --marigold:#E8AE4A; --marigold-soft:#3A2D14;
  --ok:#6FD08E; --ok-soft:#173222; --bad:#F2867D; --bad-soft:#3D1D1B; --warn:#EDBE5C; --warn-soft:#3A2E12; --info:#8AB8EE; --info-soft:#1A2A3F;
  --t-home:#FF8F5A; --t-houses:#74B3F5; --t-parking:#A98BFF; --t-maint:#5FD27A; --t-comp:#FF7FA8; --t-acct:#45CBDD; --t-polls:#9D95FF; --t-gallery:#EB7FD8; --t-admin:#F2C14E; --t-svc:#A9E34B; --t-team:#FFA07A; --t-cctv:#8DB8E8; --t-myhouse:#4FC9DB; --t-tenants:#B197FC; --t-fees:#FFA94D; --t-msgs:#63E6BE; --tc-ink:#10141A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;overflow:hidden;color:#FFFFFF;padding-inline:16px;padding-block:22px 0;
  background:radial-gradient(circle at 92% -30%,rgba(255,200,40,.55),transparent 40%),radial-gradient(circle at 40% 160%,rgba(255,120,60,.30),transparent 50%),linear-gradient(110deg,#00897B 0%,#0B6FBF 50%,#6A2BC2 100%)}
header.top .in{max-width:1040px;margin:0 auto;position:relative}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px}
.brand .logo{display:flex;gap:14px;align-items:center;min-width:0}
.brand .mark{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#FFC93C,#F76707);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5.5vw,40px);margin:0;line-height:1.15;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand small{display:block;opacity:.9;font-size:14.5px}
.role{font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:99px;white-space:nowrap;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#FFFFFF}
.role.admin{background:linear-gradient(135deg,#FFE08A,#F2B705);color:#3B2A00;border-color:#FFE9A8;box-shadow:0 4px 14px rgba(242,183,5,.35)}
.toran{height:18px;margin-inline:-16px;position:relative;background:
  radial-gradient(circle at 50% 2px,#FFD43B 0 6px,#F76707 6px 8px,transparent 8.5px) 0 0/24px 18px repeat-x,
  radial-gradient(ellipse 5px 8px at 50% 4px,#2F9E44 0 99%,transparent 100%) 12px 0/24px 18px repeat-x,
  linear-gradient(#FFD43B,#FFD43B) top/100% 3px no-repeat}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px;overflow-x:auto;scrollbar-width:none;box-shadow:0 4px 14px rgba(0,0,0,.06)}
nav.tabs .in{max-width:1040px;margin:0 auto;display:flex;gap:6px;padding-block:10px}
@media (min-width:960px){nav.tabs .in{flex-wrap:wrap}}
nav.tabs button{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tc) 30%,var(--surface));border-radius:99px;padding:6px 12px 6px 9px;transition:transform .12s,background .12s}
nav.tabs button .i{font-size:17px;line-height:1}
nav.tabs button:hover{background:color-mix(in srgb,var(--tc) 20%,var(--surface))}
nav.tabs button[aria-selected="true"]{background:var(--tc);color:var(--tc-ink);border-color:var(--tc);box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 40%,transparent)}
nav.tabs button.admin{border-style:dashed}
nav.tabs button.admin[aria-selected="true"]{border-style:solid;background:linear-gradient(135deg,var(--t-admin),color-mix(in srgb,var(--t-admin) 70%,#F76707))}
nav.tabs button:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){nav.tabs button:active{transform:scale(.96)}}
.sechead{margin-top:20px;display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 18%,var(--surface)),color-mix(in srgb,var(--tc) 5%,var(--surface)));border:1px solid color-mix(in srgb,var(--tc) 28%,var(--surface))}
.sechead .ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--tc);box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 35%,transparent)}
.sechead h2{margin:0;color:var(--tc);font-size:26px}
.sechead p{margin:0;color:var(--muted);font-size:14.5px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:28px 0 12px;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick button{font:inherit;text-align:left;cursor:pointer;border-radius:12px;padding:12px;border:1.5px solid color-mix(in srgb,var(--tc) 30%,var(--surface));background:color-mix(in srgb,var(--tc) 9%,var(--surface));color:var(--ink);display:grid;gap:2px}
.quick button b{color:var(--tc);font-size:15px}
.quick button span.e{font-size:22px}
.quick button:hover{border-color:var(--tc)}
.card.cam{display:grid;gap:10px;align-content:start}
.card.cam.isbad{border:1.5px solid var(--bad);background:linear-gradient(135deg,var(--bad-soft),var(--surface))}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card.mem{display:flex;gap:14px;align-items:flex-start}
.card.mem.chief{border:1.5px solid var(--tc);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 10%,var(--surface)),var(--surface))}
.av{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,var(--tc),color-mix(in srgb,var(--tc) 60%,#F59F00));color:var(--tc-ink);font-size:22px;font-weight:700;box-shadow:0 3px 10px color-mix(in srgb,var(--tc) 30%,transparent)}
.av img{width:100%;height:100%;object-fit:cover}
.post{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:var(--tc)}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card.svc{display:grid;gap:10px;align-content:start}
.sico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--tc) 16%,var(--surface))}
.phone{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:-4px 0 14px;scrollbar-width:thin}
.chips button{font:inherit;font-size:13.5px;white-space:nowrap;cursor:pointer;border-radius:99px;padding:4px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:var(--tc-ink)}
.card .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;margin-top:8px;font-size:14px}
.kv div span{color:var(--muted)}
.hno{font-family:var(--display);font-size:22px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--info-soft);color:var(--info)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-mar{background:var(--marigold-soft);color:var(--marigold)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.grow{flex:1 1 auto}
.toolbar .grow{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--tc);outline-offset:1px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--tc);background:var(--tc);color:var(--tc-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--tc)}
.btn.sm{font-size:13.5px;padding:5px 10px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.notice{border-left:3px solid var(--marigold);padding:4px 0 4px 12px;margin-bottom:12px}
.notice p{margin:2px 0 0;white-space:pre-wrap}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.c,th.c{text-align:center} td.r,th.r{text-align:right}
.dot{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:6px;font-size:13px;font-weight:700;text-align:center}
.dot.y{background:var(--ok-soft);color:var(--ok)} .dot.n{background:var(--bad-soft);color:var(--bad)} .dot.x{color:var(--muted)} .dot.l{background:var(--marigold-soft);color:var(--marigold)} .dot.w{background:var(--warn-soft);color:var(--warn)}
.deadline{margin-top:20px;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--marigold);border-radius:var(--r);padding:12px 14px}
.deadline.late{border-left-color:var(--bad)}
.deadline .cal{flex:none;width:74px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--marigold-soft);line-height:1.15}
.deadline.late .cal{background:var(--bad-soft)}
.deadline .cal b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.deadline .cal small{font-size:11.5px;color:var(--muted)}
.contacts{display:grid;gap:6px;font-size:15px}
.contacts div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--marigold-soft);color:var(--ink);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .dbody{padding:20px;display:grid;gap:12px}
dialog h3{font-family:var(--display);font-weight:400;font-size:22px}
.f label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.f.check label{display:flex;gap:8px;align-items:center}
.f.check input{width:auto}
.err{color:var(--bad);font-size:14px;min-height:1em}
.dfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.receipt{border:1px dashed var(--line);border-radius:var(--r);padding:14px;font-size:15px}
.receipt .t{font-family:var(--display);font-size:20px;text-align:center}
.receipt table td{white-space:normal}
.votes{font-size:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.ph{position:relative;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;aspect-ratio:1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12.5px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

/* ---- login / app-owner screens ---- */
body.locked{overflow:hidden}
#auth{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
#auth .ahead{color:#fff;text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 0;
  background:radial-gradient(circle at 90% -30%,rgba(255,200,40,.55),transparent 40%),linear-gradient(110deg,#00897B 0%,#0B6FBF 50%,#6A2BC2 100%)}
#auth .ahead .mark{margin:0 auto 10px;width:64px;height:64px;font-size:32px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#FFC93C,#F76707);box-shadow:0 6px 18px rgba(0,0,0,.25)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
#auth .ahead h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
#auth .ahead p{margin:2px 0 18px;opacity:.9}
#auth .toran{margin:0}
.acard{max-width:440px;margin:22px auto 40px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 10px 30px rgba(0,0,0,.06);margin-inline:max(16px,calc(50% - 220px))}
.atitle{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;color:var(--ink)}
.aform{display:grid;gap:12px}
.btn.big{font-size:17px;padding:12px 16px;width:100%}
.phonein{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.phonein span{display:grid;place-items:center;padding:0 12px;background:var(--bg);color:var(--muted);font-weight:600}
.phonein input{border:0;border-radius:0;font-size:18px;letter-spacing:.04em}
.otp{font-size:26px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.pick{font:inherit;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pick:hover{border-color:var(--accent)}
button.role{cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
.upibox{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px;font-size:14.5px}
.upibox .qr{flex:none;width:150px;background:#fff;border-radius:8px;padding:4px}
.upibox .qr svg{display:block;width:100%;height:auto}
@media (max-width:460px){.upibox{flex-direction:column}.upibox .qr{width:180px;align-self:center}}
.tn{display:grid;gap:10px;align-content:start}
.tn .top{display:flex;gap:12px;align-items:flex-start}
.tn .av{width:72px;height:72px;border-radius:12px}
.docs{display:flex;gap:8px;flex-wrap:wrap}
.docs .ph{width:96px;height:72px}
.msg{border-left:4px solid var(--tc);background:var(--surface);border-radius:8px;padding:10px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.msg h3{margin:0;font-size:17px}
.msg p{margin:4px 0 0;white-space:pre-wrap}
.hpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.hpick label{display:flex;gap:6px;align-items:center;font-size:14.5px}
