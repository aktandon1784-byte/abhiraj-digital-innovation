<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Prerender</title>
</head>
<body>
  <!-- Static form definition for Netlify Forms build-time crawler detection in Next.js -->
  <form name="contact" method="POST" data-netlify="true" netlify data-netlify-honeypot="bot-field" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
